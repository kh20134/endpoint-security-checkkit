name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\tests\EndpointCheckKit.Tests.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\tests\EndpointCheckKit.Tests.ps1
